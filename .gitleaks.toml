# gitleaks 配置
# 文档: https://github.com/gitleaks/gitleaks#configuration
#
# 设计前提（均为实测结论，2026-08-17 gitleaks 8.30.1）：
#
# 1. 受版本控制的文件里共 9 处命中，全部是 learning-notes 下 markdown 的
#    **文档示例**（curl -H "Authorization: Bearer ..."、示例 JWT、示例 sk_ 值等）。
#    另有 79 处命中在 .env(×3) 与 .gitnexus/*（本地索引缓存）里——这些都已被
#    .gitignore 挡住，CI 检出里不存在，属 `gitleaks dir` 扫本地文件系统的过度报告。
#
# 2. 因此**没有为这 9 处配置值级白名单**：那会在正文里留下盲区，而且
#    20-Agent支付 子树是 git-crypt 加密的，把它的明文片段抄进这个明文配置
#    等于绕过加密。真正的防护交给 CI 的区间扫描（只扫将要合入 main 的新提交），
#    历史基线由每周全量扫描以「咨询性报告」形式呈现。
#
# 3. 不使用 .gitleaksignore 指纹：指纹含 commit SHA，浅克隆下同一内容会被
#    归到不同 commit，豁免因此不可复现（在姊妹仓踩过）。CI 用 fetch-depth: 0。

[extend]
useDefault = true

[[allowlists]]
description = "git-crypt 加密路径与本地工具产物"
paths = [
  # git-crypt 加密的文件在 CI 检出里是二进制块（文件头 GITCRYPT）。
  # 实测对加密态扫描 0 命中，扫它没有意义；而本地扫描看到的是明文，
  # 那些内容你本来就有权限读，交由本地流程负责。
  '''^\.kiro/hooks/.*\.kiro\.hook$''',
  '''^\.kiro/steering/(doc-maintenance|project-conventions)\.md$''',
  '''^learning-notes/\.audit-progress\.md$''',
  '''^learning-notes/00-ai/04-ai-agent/20-Agent支付/''',
  '''^learning-notes/00-ai/04-ai-agent/24-2026技术更新/.*\.md$''',
  '''^scripts/doc-lint\.sh$''',
  '''^shared/watermark(_cli)?\.py$''',

  # 本地工具产物，已被 .gitignore 挡住；列在此处是为了让本地
  # `gitleaks dir .` 的输出也可读（否则 76 处缓存噪声淹没真信号）。
  '''^\.gitnexus/''',
]

# 历史文档示例的 commit 级豁免。
#
# 为什么需要：`gitleaks git` 扫的是历史 patch。当前文件里的类密钥示例值已在
# 2026-08-17 逐条改成明显假值（sk_test_EXAMPLE_DO_NOT_USE / EXAMPLE_JWT_DO_NOT_USE
# / $LITELLM_MASTER_KEY 等，改后当前树受控文件命中为 0），但旧 commit 里的原值
# 仍在历史中。不改写历史就无法让全历史扫描归零。
#
# 为什么用 commit 而不是 path 或 regex：commit 级豁免只赦免这 8 个具名提交，
# 其余任何历史提交与所有未来提交照常全量扫描——不会在正文或文件上留下永久盲区。
# 也不用 .gitleaksignore 指纹：指纹含 file+line，文件一改就漂移。
#
# 逐条核对结论（全部为学习笔记中的文档示例，非真实凭据）：
#   0800a249 2026-04-15  5 处  Markdown CLI interface 临时文件
#   f830c9c1 2026-04-09  1 处  did:key 示例（按定义是公钥，真假阳性）
#   247179f0 2026-04-09  1 处  AgentToken CLI 设计规范示例
#   40a11ae1 2026-04-10  1 处  sk_ 前缀示例值撞 stripe-access-token 规则
#   de43842c 2026-03-27  1 处  iOS 日志规范里的反面示例
#   cc4ccbd7 2026-03-27  1 处  Agent 支付协议 JSON 示例中的截断 JWT
#   4e97bd77 2026-03-26  1 处  curl -H "Authorization: Bearer ..." 教学示例
#   bc8d289b 2025-12-17  1 处  kubectl describe secret 输出（本地教学集群）
#
# 新增条目前请先确认命中确为示例值，并在此登记理由——这份清单是审计线索，
# 不是消除告警的开关。
[[allowlists]]
description = "已核实为文档示例的历史提交（当前文件已改为明显假值）"
commits = [
