name: Docs Quality CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'learning-notes/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'learning-notes/**'
  # 每周一早上 9 点（UTC+8）自动运行一次完整检查
  schedule:
    - cron: '0 1 * * 1'
  # 供 ff-main-from-briefings.yml 作为快进 main 的前置 gate 调用（workflow_call），
  # 检查跑在 auto/briefings 上、快进之前——不绿则 main 不动。
  # 必需：main 由 GITHUB_TOKEN 更新，GitHub 防递归机制不会级联触发 push 事件。
  workflow_call:
  # 手动补跑入口
  workflow_dispatch:

jobs:
  # ============================================
  # Job 0: 解析本批推送涉及的变更文件
  # ============================================
  # 单独成 job 是为了让 markdown-lint 与 doc-quality 共用同一份判定，
  # 而不是各写一份 diff 逻辑（两份副本必然漂移）。
  changes:
    name: Resolve Changed Files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.resolve.outputs.files }}
      scope: ${{ steps.resolve.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析变更文件
        id: resolve
        run: |
          set -u
          ZERO=0000000000000000000000000000000000000000

          emit() {   # emit <scope> [file-list]
            {
              echo "scope=$1"
              echo "files<<__FILES_EOF__"
              [ "$#" -ge 2 ] && printf '%s' "$2"
              echo ""
              echo "__FILES_EOF__"
            } >> "$GITHUB_OUTPUT"
          }

          # 选 diff 基线。用 github.event.before 而非 HEAD~1，才能覆盖
          # 「一次 push 含多个 commit」的整批变更（HEAD~1 只看最后一个）。
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            schedule)     BASE="__ALL__" ;;
            # push / workflow_call（复用工作流沿用调用方的 event 上下文，
            # 所以这里能拿到调用方那次 push 的 before）
            *)            BASE="${{ github.event.before }}" ;;
          esac

          if [ "$BASE" = "__ALL__" ]; then
            emit all "learning-notes/**/*.md"
            echo "基线：全量扫描（schedule）"
            exit 0
          fi

          # before 在新建分支时是全零；强推或 GC 后对象也可能不在本地。
          # 此时退回 HEAD~1，**绝不在阻断语境下退回全量扫描**——
          # 全树有 11000+ 条历史遗留 lint 违规，那会把简报发布永久卡死。
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE=$(git rev-parse HEAD~1)
              echo "before 不可用，基线回退到 HEAD~1: $BASE"
            else
              emit none
              echo "无可用基线（初始提交），跳过"
              exit 0
            fi
          fi

          # 两个要点：
          # 1. 用目录 pathspec + 后缀过滤，避免 'learning-notes/**/*.md' 这类 glob
          #    在 git pathspec 下对层级的歧义，确保任意深度的 .md 都算进来。
          # 2. 输出用换行分隔而非空格——仓库里有 69 个文件名带空格，
          #    空格分隔会把 'a b.md' 拆成两个无效 glob，造成静默漏检。
          FILES=$(git diff --name-only "$BASE" HEAD -- learning-notes/ | grep -E '\.md$' || true)
          emit diff "$FILES"
          echo "基线 $BASE → HEAD"
          echo "变更 .md 文件 $(printf '%s' "$FILES" | grep -c . || true) 个:"
          printf '%s\n' "$FILES" | sed 's/^/   /'

  # ============================================
  # Job 1: Markdown 格式 Lint（仅检查本次变更的文件）
  # ============================================
  markdown-lint:
    name: Markdown Lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: markdownlint（变更文件）
        if: needs.changes.outputs.files != ''
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: ${{ needs.changes.outputs.files }}
          config: '.markdownlint.jsonc'
        # 变更文件语境下阻断（作为 ff gate 的一部分）；
        # schedule 是全量扫描，历史遗留违规不该每周把工作流刷红，故仅告警。
        continue-on-error: ${{ github.event_name == 'schedule' }}

  # ============================================
  # Job 2: 外部链接检查（仅 schedule，咨询性质不阻断）
  # ============================================
  # 注意：本 job 实际校验的是「外部 URL 可达性」，不是内部链接——
  # 内部相对链接已由下面的 doc-quality job 用纯 shell 覆盖（16 秒，只查 .md 相对路径）。
  #
  # 为什么不在 push 上跑：917 个 md 文件逐个发 HTTP 请求要 1h+，且简报每天新增 3 个文件，
  # 成本只增不减。外链失效是渐变的，每周查一次足够。
  # 为什么 continue-on-error 在 job 级：外链校验有不可消除的假阳性
  # （如 gartner.com 对 CI 出口 IP 返 403），且 step 级 continue-on-error
  # 管不住 action 的 post 清理步骤失败，工作流仍会变红。
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 检查外部链接可达性
        uses: tcort/github-action-markdown-link-check@v1
        with:
          folder-path: 'learning-notes/'
          file-extension: '.md'
          config-file: '.markdown-link-check.json'
        continue-on-error: true

  # ============================================
  # Job 3: 文档质量检查（内联脚本，不依赖加密的 doc-lint.sh）
  # ============================================
  doc-quality:
    name: Doc Quality
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查内部链接引用
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGED: ${{ needs.changes.outputs.files }}
        run: |
          set -u
          echo "🔍 检查断裂的内部链接..."
          # 三个坑叠在这一段里：
          # 1. `... | while read` 在子壳里跑，计数器自增会随子壳消失
          #    （原实现就是这个 bug，导致检查永远返回 0）。改用进程替换喂 while，
          #    循环体留在当前壳里。
          # 2. GitHub 的 run 默认 shell 是 `bash -e`，所以**不能加 pipefail**：
          #    grep 无匹配时返回 1，加了 pipefail 会让脚本在第一个
          #    「不含 .md 链接」的文件上当场中止（本地不带 -e 跑测不出来）。
          # 3. 全仓扫描，但只对**本批变更文件**阻断。否则任何一条历史断链
          #    都会把每日简报发布永久卡死——无关欠债不该拦住新内容。
          BROKEN="$(mktemp)"
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              [ -n "$link" ] || continue
              case "$link" in http*) continue ;; esac
              decoded="${link//%20/ }"
              [ -f "$dir/$decoded" ] || printf '%s\t%s\n' "$file" "$link" >> "$BROKEN"
            done < <(grep -oE '\([^)]+\.md\)' "$file" 2>/dev/null | sed 's/^(//;s/)$//')
          done < <(find learning-notes/ -name "*.md" -type f | sort)

          if [ ! -s "$BROKEN" ]; then
            echo "✅ 内部链接全部可解析"
            exit 0
          fi

          GATE="$(mktemp)"; WARN="$(mktemp)"
          while IFS= read -r row; do
            f="${row%%$'\t'*}"; l="${row#*$'\t'}"
            if [ "$SCOPE" = "diff" ] && printf '%s\n' "$CHANGED" | grep -qxF "$f"; then
              echo "$f → $l" >> "$GATE"
            else
              echo "$f → $l" >> "$WARN"
            fi
          done < "$BROKEN"

          if [ -s "$WARN" ]; then
            echo "⚠️  历史遗留断链 $(grep -c . "$WARN") 条（不阻断，但请排期修）："
            sed 's/^/   /' "$WARN"
          fi
          if [ -s "$GATE" ]; then
            echo "❌ 本批变更引入/涉及的断链 $(grep -c . "$GATE") 条，阻断发布："
            sed 's/^/   /' "$GATE"
            exit 1
          fi
          echo "✅ 本批变更未引入断链"

      - name: 检查文件头部规范
        run: |
          echo "🔍 检查文件头部..."
          find learning-notes/ -name "*.md" -type f ! -name "README.md" ! -name ".*" | sort | while read -r file; do
            first=$(grep -m1 -v '^\s*$' "$file" 2>/dev/null)
            if ! echo "$first" | grep -qE '^# '; then
              echo "⚠️  缺少一级标题: $file"
            fi
          done

      - name: 检查版本标记覆盖率
        run: |
          VERSIONED=$(grep -rl "version-check:" learning-notes/ --include="*.md" 2>/dev/null | wc -l | tr -d ' ')
          TOTAL=$(find learning-notes/ -name "*.md" -type f ! -name "README.md" ! -name ".*" | wc -l | tr -d ' ')
          echo "📊 版本标记覆盖率: $VERSIONED / $TOTAL"

  # ============================================
  # Job 4: 文档统计报告（仅 schedule 触发）
  # ============================================
  doc-stats:
    name: Doc Stats Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: 生成文档统计报告
        run: |
          echo "# 📊 文档统计报告" > doc-stats-report.md
          echo "" >> doc-stats-report.md
          echo "生成时间: $(date -u '+%Y-%m-%d %H:%M UTC')" >> doc-stats-report.md
          echo "" >> doc-stats-report.md
          echo "## 文档数量" >> doc-stats-report.md
          echo "" >> doc-stats-report.md
          echo "| 目录 | 文件数 | 总行数 |" >> doc-stats-report.md
          echo "|------|--------|--------|" >> doc-stats-report.md
          for dir in learning-notes/ai-agent/*/; do
            if [ -d "$dir" ]; then
              dirname=$(basename "$dir")
              file_count=$(find "$dir" -name "*.md" -type f | wc -l | tr -d ' ')
              line_count=$(find "$dir" -name "*.md" -type f -exec cat {} + 2>/dev/null | wc -l | tr -d ' ')
              echo "| $dirname | $file_count | $line_count |" >> doc-stats-report.md
            fi
          done
          echo "" >> doc-stats-report.md
          versioned=$(grep -rl "version-check:" learning-notes/ --include="*.md" 2>/dev/null | wc -l | tr -d ' ')
          total=$(find learning-notes/ -name "*.md" -type f ! -name "README.md" | wc -l | tr -d ' ')
          echo "## 版本标记覆盖率" >> doc-stats-report.md
          echo "" >> doc-stats-report.md
          echo "- 有版本标记的文件: $versioned / $total" >> doc-stats-report.md
          cat doc-stats-report.md

      - name: 上传统计报告
        uses: actions/upload-artifact@v4
        with:
          name: doc-stats-report
          path: doc-stats-report.md
          retention-days: 30
